name: Reproduce analysis
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-renv@v2
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install --yes texlive-xetex texlive-latex-extra
      - name: Refit and verify
        run: |
          cp results/test_metrics.csv /tmp/expected-metrics.csv
          Rscript scripts/run_analysis.R
          Rscript tests/test_analysis.R
          Rscript scripts/check_reproduction.R /tmp/expected-metrics.csv
          Rscript scripts/render_report.R
